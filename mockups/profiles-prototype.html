<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Players &amp; Profiles Prototype</title>
<style>
/* Clickable prototype of the "Players & profiles" tab (not served). Sample data only, generated in the page.
   The dark bar is the prototype's own: it switches the visual style and opens "Your choices". */
:root { --pbar-h: 44px; --pbar: #26241f; --pbar-fg: #f4f1ea; --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --serif: Georgia, "Times New Roman", serif; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; overflow-x: hidden; }
body { background: var(--pbar); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.pbar { position: sticky; top: 0; z-index: 50; background: var(--pbar); color: var(--pbar-fg); padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; min-height: var(--pbar-h); }
.pbar .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; margin-right: 6px; }
.pbar .seg { display: inline-flex; border: 1px solid rgba(244,241,234,.5); border-radius: 999px; overflow: hidden; }
.pbar .seg button { background: none; border: 0; color: inherit; padding: 3px 12px; font-size: 13px; }
.pbar .seg button[aria-pressed="true"] { background: var(--pbar-fg); color: var(--pbar); }
.pbar .grow { flex: 1; }
.pbar .pick { background: #d4a24c; color: #1d1a14; border: 0; border-radius: 999px; padding: 5px 14px; font-weight: 600; }
@media (max-width: 760px) { .pbar { padding: 6px 10px; } .pbar .lbl { display: none; } .pbar .seg button { padding: 2px 8px; font-size: 12px; } }

/* three styles: every colour is a token */
.app { --r: 10px; min-height: calc(100vh - var(--pbar-h)); background: var(--bg); color: var(--fg); }
.app[data-style="clean"] { --bg: #f5f6f8; --panel: #ffffff; --fg: #17191d; --muted: #646b76; --line: #e2e5ea; --soft: #eef1f5;
  --accent: #2563eb; --accent-fg: #ffffff; --accent-soft: #e5edfd; --ok: #15803d; --ok-soft: #e6f4ea; --bad: #c2410c; --bad-soft: #fdeee6; --warn: #a16207; --head: var(--sans); --hw: 650; --shadow: 0 1px 2px rgba(16,24,40,.06);
  --c1: #2563eb; --c2: #15803d; --c3: #d97706; --c4: #7c3aed; --c5: #0891b2; --c6: #6b7280; }
.app[data-style="dark"] { --bg: #0f1218; --panel: #171c25; --fg: #e9e6df; --muted: #9aa1ad; --line: #262d39; --soft: #1e2430;
  --accent: #d4a24c; --accent-fg: #17130a; --accent-soft: #2e2716; --ok: #5ccf8c; --ok-soft: #173225; --bad: #f2795f; --bad-soft: #3a1e18; --warn: #e4b85b; --head: var(--sans); --hw: 650; --shadow: none;
  --c1: #d4a24c; --c2: #5ccf8c; --c3: #6aa8f0; --c4: #c58af0; --c5: #f2795f; --c6: #9aa1ad; }
.app[data-style="classic"] { --bg: #ece3cf; --panel: #faf4e6; --fg: #2a2116; --muted: #6f604a; --line: #d9ccb0; --soft: #f1e8d4;
  --accent: #8c2f1f; --accent-fg: #fbf3e4; --accent-soft: #f2dccf; --ok: #3d6b2e; --ok-soft: #e3ead3; --bad: #8c2f1f; --bad-soft: #f2dccf; --warn: #8a5a12; --head: var(--serif); --hw: 600; --shadow: 0 1px 0 rgba(90,60,20,.12); --r: 6px;
  --c1: #8c2f1f; --c2: #3d6b2e; --c3: #b8862b; --c4: #3b5b7a; --c5: #6e4a7a; --c6: #7a7a6a; }
.app[data-style="classic"] .card { border-width: 1px 1px 2px; }
/* classic wins are green and losses red-brown; in classic --bad equals the accent, so give losses their own shade */
.app[data-style="classic"] { --bad: #a8412a; }

.shell { max-width: 1040px; margin: 0 auto; padding: 18px 16px 56px; display: grid; gap: 16px; }
.ph h1 { font-family: var(--head); font-weight: var(--hw); font-size: 24px; margin: 0; }
.ph p { margin: 2px 0 0; color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 8px; padding: 6px 12px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; border-radius: 999px; padding: 1px 9px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.subnav { display: flex; gap: 6px; flex-wrap: wrap; }
.subnav button { border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 999px; padding: 5px 14px; }
.subnav button[aria-current="true"] { color: var(--accent-fg); background: var(--accent); border-color: var(--accent); }
.filters { display: grid; gap: 10px; }
.filters .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.filters .row > .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); width: 58px; flex: none; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }
.avatar.big { width: 64px; height: 64px; font-size: 26px; font-family: var(--head); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
th button { background: none; border: 0; padding: 0; color: inherit; font-weight: 500; font-size: 12px; }
th button[aria-sort] { color: var(--accent); font-weight: 650; }
td { padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow: auto; max-height: 400px; }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.list li { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.list li .grow { flex: 1; min-width: 100px; }
.bar { height: 7px; border-radius: 4px; background: var(--soft); overflow: hidden; position: relative; min-width: 60px; }
.bar i { display: block; height: 100%; }
.bar b { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .6; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 140px), 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--soft); min-width: 0; }
.tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .s { font-size: 11px; color: var(--muted); margin-top: 2px; }
.tile .s.up { color: var(--ok); } .tile .s.dn { color: var(--bad); }

/* sections */
.sec h2 { font-family: var(--head); font-weight: var(--hw); font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec h2 .n { color: var(--accent); font-size: 13px; font-family: var(--sans); }
.sec .head { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; margin-bottom: 4px; }
.optsw { display: inline-flex; align-items: center; gap: 8px; }
.optsw .seg2 { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--panel); }
.optsw .seg2 button { background: none; border: 0; padding: 3px 12px; color: var(--muted); font-weight: 600; }
.optsw .seg2 button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.optname { font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.ch { width: 100%; position: relative; }
.ch svg { display: block; max-width: 100%; overflow: visible; }
.ax { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.lab { fill: var(--fg); font-size: 12px; }
.grid-l { stroke: var(--line); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.empty { padding: 28px 8px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
.subh { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 14px 0 6px; }
[data-tip] { cursor: default; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--fg); color: var(--bg); padding: 6px 10px; border-radius: 6px; font-size: 12px; line-height: 1.4; max-width: 240px; box-shadow: 0 4px 14px rgba(0,0,0,.25); }
.tip b { display: block; }
.hero2 { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.hero2 .nm { font-family: var(--head); font-weight: var(--hw); font-size: 26px; line-height: 1.1; }
.hero2 .grow { flex: 1; min-width: 160px; }
.hero2 .big { text-align: right; }
.hero2 .big .v { font-family: var(--head); font-size: 44px; font-weight: var(--hw); line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 20px; }
@media (max-width: 640px) { .board { grid-template-columns: 1fr; } .hero2 .big { text-align: left; } }
.stat-row { display: grid; grid-template-columns: 92px minmax(0,1fr) 64px; gap: 10px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.stat-row:last-child { border-bottom: 0; }
.stat-row .k { color: var(--muted); font-size: 12px; } .stat-row .v { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.pips { display: flex; gap: 3px; } .pips i { width: 12px; height: 12px; border-radius: 3px; display: block; flex: none; }
.gauge { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.gauge dl { margin: 0; display: grid; grid-template-columns: auto auto; gap: 6px 22px; flex: 1; min-width: 200px; }
.gauge dt { color: var(--muted); } .gauge dd { margin: 0; text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
.split { display: grid; grid-template-columns: 170px minmax(0,1fr); gap: 18px; align-items: center; }
@media (max-width: 560px) { .split { grid-template-columns: 1fr; justify-items: center; } .split > div:last-child { width: 100%; } }
.leg-list { display: grid; gap: 6px; }
.leg-list .r { display: grid; grid-template-columns: 12px minmax(0,1fr) auto auto; gap: 8px; align-items: center; font-size: 13px; }
.leg-list .r i { width: 10px; height: 10px; border-radius: 2px; display: block; }
.hist3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
.hist3 h4 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
.hide-sm { }
@media (max-width: 520px) { .hide-sm { display: none; } }

/* choices drawer */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: var(--panel); border-left: 1px solid var(--line); z-index: 80; display: flex; flex-direction: column; box-shadow: -8px 0 30px rgba(0,0,0,.25); }
.drawer header { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.drawer header h3 { margin: 0; font-family: var(--head); font-weight: var(--hw); font-size: 18px; flex: 1; }
.drawer .body { padding: 12px 16px; overflow: auto; flex: 1; display: grid; gap: 10px; align-content: start; }
.drawer .item { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: grid; gap: 6px; background: var(--bg); }
.drawer .item.dropped { opacity: .6; }
.drawer .item .t { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.drawer .item .t b { font-size: 13px; }
.drawer textarea { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; resize: vertical; min-height: 40px; }
.drawer footer { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 8px; }
.drawer footer textarea { min-height: 150px; font-size: 12px; font-family: ui-monospace, Menlo, Consolas, monospace; }
.toggle { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 2px 12px; font-size: 12px; font-weight: 600; }
.toggle[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.toggle[aria-pressed="false"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 70; }
</style>
</head>
<body>
<div class="pbar">
  <strong>Players &amp; profiles prototype</strong>
  <span class="lbl">Style</span>
  <span class="seg" id="styleSeg"></span>
  <span class="grow"></span>
  <button class="pick" id="openChoices">Your choices</button>
</div>
<div class="app" id="app" data-style="classic">
  <div class="shell">
    <div class="ph"><h1>Players &amp; profiles</h1><p>Sample data for five friends, about 500 games each. Pick a player, a view and a period, then choose an option in each section.</p></div>
    <div class="card filters" id="filters"></div>
    <div id="sections" style="display:grid;gap:16px"></div>
  </div>
  <div class="tip" id="tip" hidden></div>
  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" hidden aria-label="Your choices"></aside>
</div>

<script>
"use strict";
/* ============================ sample data ============================ */
const PLAYERS = ['Ryan', 'Daniel', 'Christopher', 'Joe', 'Nathan'];
const CIVS = ['Franks','Mongols','Britons','Aztecs','Mayans','Persians','Teutons','Vikings','Byzantines','Chinese','Magyars','Lithuanians','Spanish','Turks','Ethiopians','Huns','Khmer','Portuguese','Poles','Burgundians','Bulgarians','Celts','Japanese','Hindustanis'];
const MAPS = ['Arabia','Arena','Black Forest','Nomad','Islands','Team Islands','Mediterranean','Gold Rush','Highland','Baltic','Coastal','Four Lakes'];
const OPENINGS = ['Scouts into Archers','Men-at-Arms into Archers','Drush into Archers','Fast Castle','Straight Archers'];
const ARMY = ['Infantry','Archers','Cavalry','Siege','Monks & other'];
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TODAY = Date.UTC(2026, 9, 25, 22, 0, 0), DAY = 864e5;
const TEAM_MINE = 6, TEAM_THEIRS = 5;

function rng(seed) { let a = seed >>> 0; return function () { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function pickW(r, w) { let s = 0; for (const x of w) s += x; let v = r() * s; for (let i = 0; i < w.length; i++) { v -= w[i]; if (v <= 0) return i; } return w.length - 1; }
function gauss(r) { return Math.sqrt(-2 * Math.log(r() + 1e-9)) * Math.cos(6.2832 * r()); }

function genPlayer(pi) {
  const r = rng(9001 + pi * 131);
  const prof = {
    skill: [0.515, 0.50, 0.47, 0.535, 0.49][pi], target: [1480, 1390, 1250, 1560, 1330][pi], eapm: [78, 64, 52, 91, 70][pi],
    lenSlope: [0.04, -0.05, 0.06, 0.0, -0.03][pi], peakHour: [21, 20, 22, 19, 23][pi], feudal: [-0.3, 0.2, 0.9, -0.6, 0.1][pi],
    civW: CIVS.map(() => 0.25 + r() * 0.5), civEdge: CIVS.map(() => gauss(r) * 0.05), oppEdge: CIVS.map(() => gauss(r) * 0.045),
    mapW: MAPS.map(() => 0.3 + r() * 0.7), mapEdge: MAPS.map(() => gauss(r) * 0.045),
    openW: OPENINGS.map(() => 0.3 + r()), mix: ARMY.map((_, i) => [0.28, 0.3, 0.25, 0.1, 0.07][i] * (0.7 + r() * 0.6)),
  };
  for (let k = 0; k < 4; k++) { const c = Math.floor(r() * CIVS.length); prof.civW[c] += 1.6; prof.civEdge[c] += 0.05; }
  const games = [], ratings = { one: prof.target - 120 + r() * 60, team: prof.target - 200 + r() * 60 };
  for (let i = 0; i < 500; i++) {
    const d = Math.floor(730 * Math.pow(r(), 1.3)), mr = r();
    const mode = mr < 0.52 ? 'r1' : mr < 0.78 ? 'rt' : mr < 0.9 ? 'unr' : 'tour';
    let hour = Math.round(prof.peakHour + gauss(r) * 2.6); hour = ((hour % 24) + 24) % 24;
    const wd = pickW(r, [0.8, 0.9, 1, 1, 1.2, 1.6, 1.5]);
    const ts = TODAY - d * DAY - (22 - hour) * 36e5;
    let civ = pickW(r, mode === 'rt' ? prof.civW.map((w, k) => (k < TEAM_MINE ? w * 3 : w * 0.05)) : prof.civW);
    const opp = Math.floor(r() * CIVS.length), map = pickW(r, prof.mapW);
    const len = Math.max(6, Math.min(75, 9 - Math.log(r() + 1e-6) * 15 + (mode === 'rt' ? 6 : 0)));
    let p = prof.skill + prof.civEdge[civ] + prof.oppEdge[opp] + prof.mapEdge[map] + prof.lenSlope * (len - 28) / 12 + (mode === 'tour' ? -0.03 : 0);
    p = Math.max(0.2, Math.min(0.82, p));
    const won = r() < p, k = 12 + r() * 9;
    const g = { id: pi * 1000 + i, ts, civ: CIVS[civ], opp: CIVS[opp], map: MAPS[map], mode, won, len, hour, wd: (new Date(ts)).getUTCDay() === 0 ? 6 : (new Date(ts)).getUTCDay() - 1, k, rating: 0, eapm: Math.round(prof.eapm + gauss(r) * 8) };
    if (mode === 'rt') { let tm = Math.floor(r() * 4); if (tm >= pi) tm++; g.tm = PLAYERS[tm]; g.tmCiv = CIVS[Math.floor(r() * TEAM_THEIRS)]; }
    if (r() < 0.82) {
      g.op = pickW(r, prof.openW);
      const fe = 10.3 + prof.feudal + gauss(r) * 0.9 - (g.op === 3 ? -2.2 : 0) + (g.op === 4 ? 0.2 : 0);
      g.feudal = Math.max(8, Math.min(len - 1, fe)); g.castle = g.feudal + (g.op === 3 ? 4.6 : 6.4) + gauss(r) * 1.1;
      g.imp = len > 32 ? g.castle + 11 + Math.abs(gauss(r)) * 3.5 : null;
      if (g.castle > len) g.castle = null; if (g.imp && g.imp > len) g.imp = null;
      const m = prof.mix.map((v, k) => v * (0.6 + r() * 0.8) * (k === 2 && won ? 1.1 : 1)), s = m.reduce((a, b) => a + b, 0);
      g.mix = m.map(v => v / s);
    }
    games.push(g);
  }
  games.sort((a, b) => a.ts - b.ts);
  games.forEach(g => { const lad = g.mode === 'rt' ? 'team' : 'one'; ratings[lad] += (g.won ? 1 : -1) * g.k + (prof.target - ratings[lad]) * 0.012; g.rating = Math.round(ratings[lad]); });
  return games;
}
const ALL = PLAYERS.map((_, i) => genPlayer(i));

/* ============================ helpers ============================ */
const NS = 'http://www.w3.org/2000/svg';
function S(tag, a, kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in (a || {})) {
    const v = a[k];
    if (k === 'text') e.textContent = v;
    else if (k === 'style') e.style.cssText += v;
    else if (k === 'tip') e.setAttribute('data-tip', v);
    else if (k === 'fill' || k === 'stroke' || k === 'color') e.style.setProperty(k, v);
    else e.setAttribute(k, v);
  }
  (kids || []).forEach(c => c && e.appendChild(c));
  return e;
}
function h(tag, cls, txt, kids) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; (kids || []).forEach(k => k && e.appendChild(k)); return e; }
const lin = (d0, d1, r0, r1) => v => r0 + (v - d0) / ((d1 - d0) || 1) * (r1 - r0);
function niceTicks(lo, hi, n) {
  n = n || 5; const span = (hi - lo) || 1, mag = Math.pow(10, Math.floor(Math.log10(span / n)));
  const st = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10, t = [];
  for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) t.push(+v.toFixed(6));
  return t;
}
const pc = x => Math.round(x * 100) + '%';
const num = x => Math.round(x).toLocaleString('en-GB');
const wl = (w, n) => w + '-' + (n - w);
const fmtD = ts => new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtM = ts => new Date(ts).toLocaleDateString('en-GB', { month: 'short', year: '2-digit', timeZone: 'UTC' });

    const minN = tg.length > 80 ? 3 : 2, rows = [...group(tg, x => x.civ + ' + ' + x.tmCiv)].map(([k, a]) => ({ k, ...rec(a) })).filter(r => r.n >= minN).sort((a, z) => z.wr - a.wr || z.n - a.n).slice(0, 8);
    if (!rows.length) return empty(b);
    const tbl = h('table'), tr = h('tr', null, null, [h('th', null, 'You + teammate civ'), h('th', 'num', 'Games'), h('th', 'num', 'Win rate')]); tbl.appendChild(tr);
    rows.forEach(r => { const td = h('td', 'num'); td.style.minWidth = '120px'; td.appendChild(h('div', 'small', pc(r.wr))); td.appendChild(winBar(r.wr)); tbl.appendChild(h('tr', null, null, [h('td', null, r.k), h('td', 'num', String(r.n) + ' (' + wl(r.w, r.n) + ')'), td])); });
    b.appendChild(h('div', 'scroll', null, [tbl])); b.appendChild(h('p', 'muted small', 'Civ pairs played together at least ' + minN + ' times, best win rate first.'));
  }
};

/* ============================ page assembly ============================ */
const secEls = {};
function buildSections() {
  const host = document.getElementById('sections'); host.textContent = '';
  SECS.forEach((s, i) => {
    const sw = h('span', 'seg2'); sw.setAttribute('role', 'group'); sw.setAttribute('aria-label', 'Options for ' + s.title);
    s.opts.forEach((name, k) => { const bt = h('button', null, 'ABC'[k]); bt.title = name; bt.setAttribute('data-sec', s.id); bt.setAttribute('data-opt', k); bt.onclick = () => { ST.opt[s.id] = k; renderSec(s.id); renderDrawer(); }; sw.appendChild(bt); });
    const body = h('div', 'body'), nm = h('p', 'optname');
    const card = h('section', 'card sec', null, [h('div', 'head', null, [h('h2', null, null, [h('span', 'n', String(i + 1)), document.createTextNode(s.title)]), h('span', 'optsw', null, [h('span', 'small muted', 'Option'), sw])]), nm, body]);
    card.id = 'sec-' + s.id; host.appendChild(card); secEls[s.id] = { card, sw, nm, body };
  });
}
let CTX = null;
function renderSec(id) {
  const s = SECS.find(x => x.id === id), e = secEls[id], o = ST.opt[id];
  e.sw.querySelectorAll('button').forEach((bt, k) => bt.setAttribute('aria-pressed', k === o ? 'true' : 'false'));
  e.nm.textContent = 'Option ' + 'ABC'[o] + ': ' + s.opts[o];
  e.body.textContent = ''; hideTip();
  try { R[id](e.body, CTX, o); } catch (err) { e.body.appendChild(h('div', 'empty', 'This chart failed: ' + err.message)); console.error(err); }
}
function renderAll() { CTX = ctx(); renderFilters(); SECS.forEach(s => renderSec(s.id)); }
function renderFilters() {
  const f = document.getElementById('filters'); f.textContent = '';
  const row = (k, items, cur, set, withAv) => { const sn = h('div', 'subnav'); items.forEach(([id, lab]) => { const bt = h('button', null, lab); bt.setAttribute('aria-current', id === cur ? 'true' : 'false'); bt.onclick = () => { set(id); renderAll(); }; sn.appendChild(bt); }); f.appendChild(h('div', 'row', null, [h('span', 'k', k), sn])); };
  row('Player', PLAYERS.map((p, i) => [i, p]), ST.player, v => { ST.player = v; });
  row('View', VIEWS, ST.view, v => { ST.view = v; });
  row('Period', PERIODS, ST.period, v => { ST.period = v; });
}

/* ============================ choices drawer ============================ */
const drawer = document.getElementById('drawer'), scrim = document.getElementById('scrim');
function keptN() { return SECS.filter(s => ST.keep[s.id]).length; }
function renderDrawer() {
  document.getElementById('openChoices').textContent = 'Your choices (' + keptN() + '/' + SECS.length + ')';
  if (drawer.hidden) return; const keepScroll = drawer.querySelector('.body') ? drawer.querySelector('.body').scrollTop : 0;
  drawer.textContent = '';
  const x = h('button', 'btn', 'Close'); x.onclick = closeDrawer;
  drawer.appendChild(h('header', null, null, [h('h3', null, 'Your choices'), x]));
  const body = h('div', 'body'); drawer.appendChild(body);
  SECS.forEach((s, i) => {
    const t = h('button', 'toggle', ST.keep[s.id] ? 'Keep' : 'Drop'); t.setAttribute('aria-pressed', ST.keep[s.id]); t.onclick = () => { ST.keep[s.id] = !ST.keep[s.id]; renderDrawer(); };
    const ta = h('textarea'); ta.placeholder = 'Notes on this section'; ta.value = ST.notes[s.id]; ta.setAttribute('aria-label', 'Notes for ' + s.title); ta.oninput = () => { ST.notes[s.id] = ta.value; };
    const it = h('div', 'item' + (ST.keep[s.id] ? '' : ' dropped'), null, [h('div', 't', null, [h('b', null, (i + 1) + '. ' + s.title), t]), h('div', 'small muted', 'Option ' + 'ABC'[ST.opt[s.id]] + ': ' + s.opts[ST.opt[s.id]]), ta]);
    body.appendChild(it);
  });
  body.scrollTop = keepScroll;
  const out = h('textarea'); out.id = 'promptOut'; out.readOnly = true; out.placeholder = 'Press Generate prompt'; out.value = ST.prompt;
  const gen = h('button', 'btn primary', 'Generate prompt'), cp = h('button', 'btn', 'Copy'), msg = h('span', 'small muted');
  gen.id = 'genPrompt'; cp.id = 'copyPrompt';
  gen.onclick = () => { ST.prompt = buildPrompt(); out.value = ST.prompt; msg.textContent = ''; };
  cp.onclick = () => { if (!out.value) { ST.prompt = buildPrompt(); out.value = ST.prompt; } const done = () => { msg.textContent = 'Copied'; }; const fb = () => { out.select(); try { document.execCommand('copy'); done(); } catch (e) { msg.textContent = 'Press Ctrl+C to copy the selected text'; } }; if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(out.value).then(done, fb); else fb(); };
  drawer.appendChild(h('footer', null, null, [h('div', 'btns', null, [gen, cp, msg]), out]));
}
function buildPrompt() {
  const kept = SECS.filter(s => ST.keep[s.id]), dropped = SECS.filter(s => !ST.keep[s.id]), L = [];
  L.push('Rebuild the "Players & profiles" tab of the AoE2 tournament site to match mockups/profiles-prototype.html, using my choices below.');
  L.push('Visual style: ' + { classic: 'Classic AoE', clean: 'Clean', dark: 'Dark' }[ST.style] + '.');
  L.push('Every section responds to the player picker, the view (All games / Ranked 1v1 / Ranked team / Unranked / Tournament) and the period (All time / Last year / Last 6 months). Charts are inline SVG with a tooltip on hover or tap, and must work at phone width.');
  L.push(''); L.push('Sections to keep (' + kept.length + '), in this order:');
  kept.forEach((s, i) => { L.push((i + 1) + '. ' + s.title + ' - Option ' + 'ABC'[ST.opt[s.id]] + ' (' + s.opts[ST.opt[s.id]] + ')' + (ST.notes[s.id].trim() ? '. Notes: ' + ST.notes[s.id].trim().replace(/\s+/g, ' ') : '')); });
  L.push(''); L.push(dropped.length ? 'Sections to drop:' : 'Sections to drop: none.');
  dropped.forEach(s => L.push('- ' + s.title + (ST.notes[s.id].trim() ? ' (notes: ' + ST.notes[s.id].trim().replace(/\s+/g, ' ') + ')' : '')));
  return L.join('\n');
}
function openDrawer() { drawer.hidden = false; scrim.hidden = false; renderDrawer(); }
function closeDrawer() { drawer.hidden = true; scrim.hidden = true; }
document.getElementById('openChoices').onclick = openDrawer; scrim.onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !drawer.hidden) closeDrawer(); });

/* style switch + boot */
const styleSeg = document.getElementById('styleSeg');
[['classic', 'Classic AoE'], ['clean', 'Clean'], ['dark', 'Dark']].forEach(([id, lab]) => { const bt = h('button', null, lab); bt.setAttribute('aria-pressed', id === ST.style); bt.onclick = () => { ST.style = id; document.getElementById('app').setAttribute('data-style', id); styleSeg.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === bt)); }; styleSeg.appendChild(bt); });
buildSections(); renderAll(); renderDrawer();
let lastW = innerWidth, rt = null;
addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { if (innerWidth !== lastW) { lastW = innerWidth; renderAll(); } }, 120); });
</script>
