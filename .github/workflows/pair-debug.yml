# TEMPORARY (branch only, never merged): why a game between two players isn't suggested.
name: Pair debug
on:
  push:
    branches: ['claude/**']
    paths: ['pipeline/debug_pair.py', '.github/workflows/pair-debug.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cryptography
      - run: |
          git fetch --depth 1 origin data
          mkdir data_enc data
          git archive FETCH_HEAD | tar -x -C data_enc
          python pipeline/crypt.py decrypt data_enc data
      - run: python pipeline/debug_pair.py
