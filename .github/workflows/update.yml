# Updates the data and publishes the site. Runs every 30 minutes, whenever something is pushed to main,
# and on demand (Actions tab > "Update and publish" > Run workflow). Public repositories run this for free.
#
# Everything the site shows is encrypted before it leaves this job (pipeline/crypt.py), on the site and on the
# "data" branch, with the key kept in Supabase. Only invited people who sign in get that key.
name: Update and publish

on:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-publish
  cancel-in-progress: false

env:
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check setup
        run: |
          if [ -z "$SUPABASE_SERVICE_KEY" ] || ! grep -q '"url": *"https' config/supabase.json; then
            echo "::error::Finish setup first: the Supabase project URL and anon key in config/supabase.json, and the SUPABASE_SERVICE_KEY repository secret (see README). Nothing is published until then, so the data is never public."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the replay reader
        run: pip install -r pipeline/requirements.txt

      # Generated data lives, encrypted, on the "data" branch (one commit, replaced each run, so the
      # repository stays small). The very first run starts from the empty copy in seed/.
      - name: Get the latest data
        run: |
          mkdir -p data data_enc
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git archive FETCH_HEAD | tar -x -C data_enc
            python pipeline/crypt.py decrypt data_enc data
          else
            cp -r seed/. data/
          fi
          rm -rf data_enc

      - name: Add new games, read replays, check accuracy
        run: python pipeline/update.py --max-replays 60

      # tournaments, players, rules and civ pools changed by organizers on the site (Supabase table admin_changes)
      - name: Save organizer changes
        run: node pipeline/apply_admin_changes.js

      - name: Save confirmed tournament games
        run: node pipeline/apply_confirmations.js

      - name: Commit organizer changes and confirmed games to main
        run: |
          git config user.name "aoe2-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          files="config/matches.json config/tournaments.json config/roster.json config/players.json config/rules.json config/civ_pool.json"
          if ! git diff --quiet -- $files; then
            git add $files
            git commit -m "Organizer changes and confirmed tournament games"
            git pull --rebase origin main && git push origin HEAD:main
          fi
          # GitHub turns off scheduled runs after 60 days without commits; nudge it once a month
          last=$(git log -1 --format=%ct origin/main)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git commit --allow-empty -m "Keep scheduled updates running" && git push origin HEAD:main
          fi

      - name: Save the data branch (encrypted)
        run: |
          python pipeline/crypt.py encrypt data data_out
          cd data_out
          git init -q -b data
          git config user.name "aoe2-site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data

      - name: Put the site together (encrypted)
        run: |
          mkdir _site
          cp -r site/. _site/
          python pipeline/crypt.py encrypt config _site/config --skip supabase.json
          cp -r data_out _site/data && rm -rf _site/data/.git
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      # only now, with the changes committed and published, take them out of the site's pending list
      - name: Clear saved organizer changes
        run: node pipeline/apply_admin_changes.js --clear
      - name: Record what happened to replays added on the site
        run: python pipeline/uploads.py mark
