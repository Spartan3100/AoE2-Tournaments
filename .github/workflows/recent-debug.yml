# TEMPORARY (branch only, never merged): compare recent games across AoE2 Companion, Microsoft and the dashboard.
name: Recent games debug
on:
  push:
    branches: ['claude/**']
    paths: ['pipeline/debug_recent.py', '.github/workflows/recent-debug.yml']
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - name: Get the latest data
        run: |
          git fetch --depth 1 origin data
          mkdir data_enc data
          git archive FETCH_HEAD | tar -x -C data_enc
          python pipeline/crypt.py decrypt data_enc data
      - run: python pipeline/debug_recent.py data
